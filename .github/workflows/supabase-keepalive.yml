name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 12 * * 0,3'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        env:
          RAW_URL: ${{ secrets.SUPABASE_URL }}
          RAW_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          SUPABASE_URL="$(printf '%s' "$RAW_URL" | tr -d '[:space:]')"
          SUPABASE_ANON_KEY="$(printf '%s' "$RAW_KEY" | tr -d '[:space:]')"

          echo "Tamanho da URL (limpa): ${#SUPABASE_URL} caracteres"
          echo "Tamanho da chave (limpa): ${#SUPABASE_ANON_KEY} caracteres"

          curl -s -o /dev/null -w "Status: %{http_code}\n" \
            "${SUPABASE_URL}/rest/v1/categories?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
